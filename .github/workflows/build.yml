name: Build

# Every push to master builds the shaded launcher jar via mvn package (on GitHub's runners, not
# locally - no Maven install needed on your machine) and publishes it as a GitHub Release, with the
# version auto-bumped off the latest existing vX.Y.Z tag - same pattern as SoultideClient's release
# workflow. Grab the built jar with `gh release download --repo NemesisRSPS/SoultideLauncher` or
# from the repo's Releases page.
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to find the latest vX.Y.Z for auto-bumping

      - name: Determine release version
        id: version
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          LATEST=${LATEST:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          echo "tag=v${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build shaded jar
        run: mvn -B package

      - name: Locate and rename built jar
        id: jar
        run: |
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name 'original-*.jar' | head -1)
          if [ -z "$JAR" ]; then
            echo "No shaded jar found in target/" >&2
            exit 1
          fi
          cp "$JAR" SoultideLauncher.jar
          echo "path=SoultideLauncher.jar" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            "${{ steps.jar.outputs.path }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

  # Native Windows installer with a bundled JRE - jpackage (needs JDK 14+, unrelated to the JDK 8
  # target the jar itself is built/run with above) wraps the already-published jar from the job
  # above into a real .exe via WiX, so players never need Java installed at all. Runs as a second
  # job (can't cross-compile a Windows installer from the ubuntu-latest runner) that uploads onto
  # the SAME release the jar job just created, rather than a separate release.
  build-windows-installer:
    needs: build-and-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Two JDKs on purpose, for different roles - jpackage itself needs 14+ to run at all, and that
      # same JDK becomes the launcher's OWN bundled runtime (its Swing UI works fine on 21). But
      # SoultideClient.jar (what ClientJavaResolver in the launcher execs for the Play button) is
      # old-style applet-era code (java.applet.Applet, javax.sound.midi, ...) that only runs on 8 -
      # Applet was removed outright in JDK 17. Earlier attempt bundled ONE shared JDK 8 runtime for
      # both (--runtime-image) - fixed the Applet crash but broke the launcher itself launching the
      # client at all (Play did nothing, no error), the same lesson a sibling project's launcher
      # (Bloodtide) already learned: forcing the client onto whatever runtime the launcher's own UI
      # needs causes subtle failures rather than a clean version mismatch. So instead JDK 8 ships as
      # a separate "client-jdk8" folder alongside the launcher's own (JDK 21) runtime - see
      # ClientJavaResolver.resolveClientJavaExecutable(). setup-java exposes each JDK it installs as
      # JAVA_HOME_<version>_X64 in addition to overwriting the plain JAVA_HOME each call, so both
      # stay addressable regardless of setup order.
      - name: Set up JDK 8 (bundled alongside as client-jdk8, NOT the installer's own runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 21 (runs jpackage AND becomes the launcher's own bundled runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the jar already published to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.build-and-release.outputs.tag }}" -p SoultideLauncher.jar --repo ${{ github.repository }}

      - name: Stage the JDK 8 bundle for --app-content
        shell: pwsh
        run: Copy-Item -Recurse "$env:JAVA_HOME_8_X64" client-jdk8

      # jpackage's --type exe needs WiX 3.x on PATH - windows-latest already ships it (confirmed via
      # an actual run: v3.14.1.20250415), and pinning an older version through choco here just fails
      # ("newer version already installed") rather than helping, so nothing to install.

      # --temp keeps jpackage's intermediate app-image around after the exe/msi wrap instead of
      # deleting it - lets the next step inspect exactly where --app-content landed client-jdk8
      # using the SAME build (no second full jpackage invocation - an earlier attempt at that via a
      # separate --type app-image run took 12+ minutes and never finished, apparently re-copying the
      # whole JDK 8 bundle a second time on top of whatever made the first run slow).
      - name: Build the installer
        shell: pwsh
        run: |
          $version = "${{ needs.build-and-release.outputs.tag }}".TrimStart('v')
          jpackage `
            --input . `
            --name SoultideLauncher `
            --main-jar SoultideLauncher.jar `
            --main-class com.soultide.launcher.Launcher `
            --type exe `
            --app-version $version `
            --vendor Soultide `
            --description "Soultide Launcher" `
            --icon packaging\icon.ico `
            --app-content client-jdk8 `
            --win-shortcut `
            --win-menu `
            --temp appimage-temp `
            --dest out

      - name: Log where --app-content landed client-jdk8 (inspects the kept --temp dir, no rebuild)
        shell: pwsh
        run: |
          Write-Host "--- appimage-temp tree (top 3 levels) ---"
          Get-ChildItem -Recurse -Depth 2 appimage-temp | Select-Object FullName | Format-Table -AutoSize
          $found = Get-ChildItem -Recurse -Directory appimage-temp -Filter "client-jdk8" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            Write-Host "FOUND client-jdk8 at: $($found.FullName)"
          } else {
            Write-Host "client-jdk8 NOT FOUND under appimage-temp - --app-content did not do what was expected"
          }

      - name: Rename to a stable asset name
        shell: pwsh
        run: |
          $exe = Get-ChildItem out\*.exe | Select-Object -First 1
          Copy-Item $exe.FullName SoultideLauncher-Setup.exe

      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.build-and-release.outputs.tag }}" SoultideLauncher-Setup.exe --clobber --repo ${{ github.repository }}
