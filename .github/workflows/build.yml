name: Build

# Every push to master builds the shaded launcher jar via mvn package (on GitHub's runners, not
# locally - no Maven install needed on your machine) and publishes it as a GitHub Release, with the
# version auto-bumped off the latest existing vX.Y.Z tag - same pattern as SoultideClient's release
# workflow. Grab the built jar with `gh release download --repo NemesisRSPS/SoultideLauncher` or
# from the repo's Releases page.
on:
  push:
    branches:
      - master
      # Mac installer test builds (2026-11-20): only the macOS jobs run here, and their disk images are workflow
      # artifacts - nothing is released and no player is offered an update.
      - mac-installer

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to find the latest vX.Y.Z for auto-bumping

      - name: Determine release version
        id: version
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          LATEST=${LATEST:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          echo "tag=v${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"

      # Bakes the version this exact build IS into the jar itself, as a plain classpath resource -
      # so the running launcher can compare itself against SoultideLauncher's own latest GitHub
      # release (a public repo, so this needs no token - see Launcher.checkForLauncherUpdate()) and
      # prompt a self-update when they differ. Must happen before `mvn package` below so it's
      # actually included in the built jar.
      - name: Embed this build's own version
        run: echo -n "${{ steps.version.outputs.tag }}" > src/main/resources/launcher-version.txt

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build shaded jar
        run: mvn -B package

      - name: Locate and rename built jar
        id: jar
        run: |
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name 'original-*.jar' | head -1)
          if [ -z "$JAR" ]; then
            echo "No shaded jar found in target/" >&2
            exit 1
          fi
          cp "$JAR" SoultideLauncher.jar
          echo "path=SoultideLauncher.jar" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            "${{ steps.jar.outputs.path }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

  # Native Windows installer with a bundled JRE - jpackage (needs JDK 14+, unrelated to the JDK 8
  # target the jar itself is built/run with above) wraps the already-published jar from the job
  # above into a real .exe via WiX, so players never need Java installed at all. Runs as a second
  # job (can't cross-compile a Windows installer from the ubuntu-latest runner) that uploads onto
  # the SAME release the jar job just created, rather than a separate release.
  build-windows-installer:
    needs: build-and-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Two JDKs on purpose, for different roles - jpackage itself needs 14+ to run at all, and that
      # same JDK becomes the launcher's OWN bundled runtime (its Swing UI works fine on 21). But
      # SoultideClient.jar (what ClientJavaResolver in the launcher execs for the Play button) is
      # old-style applet-era code (java.applet.Applet, javax.sound.midi, ...) that only runs on 8 -
      # Applet was removed outright in JDK 17. Earlier attempt bundled ONE shared JDK 8 runtime for
      # both (--runtime-image) - fixed the Applet crash but broke the launcher itself launching the
      # client at all (Play did nothing, no error), the same lesson a sibling project's launcher
      # (Bloodtide) already learned: forcing the client onto whatever runtime the launcher's own UI
      # needs causes subtle failures rather than a clean version mismatch. So instead JDK 8 ships as
      # a separate "client-jdk8" folder alongside the launcher's own (JDK 21) runtime - see
      # ClientJavaResolver.resolveClientJavaExecutable(). setup-java exposes each JDK it installs as
      # JAVA_HOME_<version>_X64 in addition to overwriting the plain JAVA_HOME each call, so both
      # stay addressable regardless of setup order.
      - name: Set up JDK 8 (bundled alongside as client-jdk8, NOT the installer's own runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 21 (runs jpackage AND becomes the launcher's own bundled runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the jar already published to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.build-and-release.outputs.tag }}" -p SoultideLauncher.jar --repo ${{ github.repository }}

      - name: Stage the JDK 8 bundle for --app-content
        shell: pwsh
        run: Copy-Item -Recurse "$env:JAVA_HOME_8_X64" client-jdk8

      # jpackage's --type exe needs WiX 3.x on PATH - windows-latest already ships it (confirmed via
      # an actual run: v3.14.1.20250415), and pinning an older version through choco here just fails
      # ("newer version already installed") rather than helping, so nothing to install.

      # NOT using --temp to inspect where --app-content lands client-jdk8 - tried that, and pairing
      # a --temp dir with --app-content, both relative paths under the same --input . directory,
      # made jpackage's own file walk during staging recurse into itself: "Cannot access file with
      # path exceeding 32000 characters". A separate full --type app-image build to inspect that
      # placement was tried too and just hung for 12+ minutes copying the JDK bundle a second time.
      # Neither is worth chasing further - ClientJavaResolver.java already checks several plausible
      # locations for client-jdk8 defensively instead of assuming one, so this ships without a CI-
      # confirmed exact path; verify by testing the installed app directly if Play still can't find it.
      # Java 11+ clients (Bloodtide's OSV-based client) run on Waystone's own Java 21 runtime (WaystoneApp.ownJava),
      # so that runtime keeps bin\java(w).exe - jpackage's default jlink options strip them (--strip-native-commands) -
      # and the full java.se module set plus what RuneLite-based clients use.
      # 2026-11-21 ("setup goes through fine but then cant be opened"): Java's Direct3D drawing off (a common reason a Java window
      # never appears on some graphics drivers), and a second Start-menu launcher, Waystone Troubleshoot, with a console window
      # showing what goes wrong; the app also writes ~/SoultideCache/waystone.log and shows startup errors in a box.
      - name: Build the installer
        shell: pwsh
        run: |
          $version = "${{ needs.build-and-release.outputs.tag }}".TrimStart('v')
          jpackage `
            --input . `
            --name Waystone `
            --main-jar SoultideLauncher.jar `
            --main-class com.soultide.launcher.WaystoneApp `
            --type exe `
            --app-version $version `
            --vendor Waystone `
            --description "Waystone - every world, one launcher" `
            --icon packaging\waystone.ico `
            --app-content client-jdk8 `
            --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.zipfs,jdk.charsets,jdk.localedata,jdk.accessibility,jdk.management,jdk.net,jdk.jfr `
            --jlink-options "--strip-debug --no-man-pages --no-header-files" `
            --java-options "-Dsun.java2d.d3d=false" `
            --add-launcher "Waystone Troubleshoot=packaging	roubleshoot.properties" `
            --win-shortcut `
            --win-menu `
            --dest out

      - name: Rename to a stable asset name
        shell: pwsh
        run: |
          $exe = Get-ChildItem out\*.exe | Select-Object -First 1
          # Waystone-Setup.exe for new players; SoultideLauncher-Setup.exe is the name the old Soultide launcher's
          # self-update looks for, so existing players are offered Waystone automatically (2026-10-24).
          Copy-Item $exe.FullName Waystone-Setup.exe
          Copy-Item $exe.FullName SoultideLauncher-Setup.exe

      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.build-and-release.outputs.tag }}" Waystone-Setup.exe SoultideLauncher-Setup.exe --clobber --repo ${{ github.repository }}

  # Mac installers (2026-11-20, user: "put a mac installer on the launcher"): a Waystone.app in a .dmg for each chip, with the
  # launcher's own Java 21 runtime and - as on Windows - a separate Java 8 (Zulu: Temurin has no Apple Silicon Java 8) in
  # Contents/client-jdk8 for the Soultide client, which ClientJavaResolver finds one level above Contents/app. Not signed with an
  # Apple Developer ID (none yet), so players open it once with right-click > Open (or Privacy & Security > Open Anyway).
  build-mac-installer:
    needs: build-and-release
    if: always() && (needs.build-and-release.result == 'success' || (github.ref != 'refs/heads/master' && needs.build-and-release.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: Waystone-Mac-AppleSilicon.dmg
          - runner: macos-15-intel
            asset: Waystone-Mac-Intel.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8 (bundled as client-jdk8 for the game client)
        id: jdk8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Set up JDK 21 (runs jpackage and becomes the launcher's own runtime)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: The launcher jar (the release's on master, built here on a test branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            gh release download "${{ needs.build-and-release.outputs.tag }}" -p SoultideLauncher.jar --repo ${{ github.repository }} -D input
          else
            echo -n "mac-test" > src/main/resources/launcher-version.txt
            JAVA_HOME="${{ steps.jdk8.outputs.path }}" mvn -B -q package
            JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name 'original-*.jar' | head -1)
            cp "$JAR" input/SoultideLauncher.jar
          fi
          ls -la input

      - name: Stage Java 8 for --app-content
        run: |
          ditto "${{ steps.jdk8.outputs.path }}" client-jdk8
          client-jdk8/bin/java -version

      # macOS wants the first number of a version to be 1 or more: v0.0.18 ships as 1.0.18
      - name: Build Waystone.app
        run: |
          TAG="${{ needs.build-and-release.outputs.tag }}"
          TAG="${TAG:-v0.0.0}"
          IFS='.' read -r MA MI PA <<< "${TAG#v}"
          echo "APPVER=1.${MI}.${PA}" >> "$GITHUB_ENV"
          "${{ steps.jdk21.outputs.path }}/bin/jpackage" \
            --type app-image \
            --input input \
            --name Waystone \
            --main-jar SoultideLauncher.jar \
            --main-class com.soultide.launcher.WaystoneApp \
            --app-version "1.${MI}.${PA}" \
            --vendor Waystone \
            --description "Waystone - every world, one launcher" \
            --icon packaging/waystone.icns \
            --app-content client-jdk8 \
            --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.zipfs,jdk.charsets,jdk.localedata,jdk.accessibility,jdk.management,jdk.net,jdk.jfr \
            --jlink-options "--strip-debug --no-man-pages --no-header-files" \
            --mac-package-identifier com.soultide.waystone \
            --mac-package-name Waystone \
            --dest out
          ls out/Waystone.app/Contents
          ls out/Waystone.app/Contents/client-jdk8/bin/java out/Waystone.app/Contents/runtime/Contents/Home/bin/java
          codesign --verify --deep --strict --verbose=2 out/Waystone.app || echo "::warning::codesign verify failed"

      - name: Build the disk image
        run: |
          "${{ steps.jdk21.outputs.path }}/bin/jpackage" --type dmg --app-image out/Waystone.app --name Waystone \
            --app-version "$APPVER" --vendor Waystone --dest dmg
          cp dmg/*.dmg "${{ matrix.asset }}"
          ls -la "${{ matrix.asset }}"

      - name: Upload to the release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.build-and-release.outputs.tag }}" "${{ matrix.asset }}" --clobber --repo ${{ github.repository }}

      - name: Keep the test build
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
